<!doctype html><meta charset="utf-8"><title>gsc runner</title><pre id="o">LOADING</pre>
<script>
const o=document.getElementById('o');
function b64d(s){s=decodeURIComponent(s);s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function getCfg(){
 let s=location.hash.slice(1);
 if(s) return b64d(s);
 let h='';
 try{h=(window.parent&&parent.location&&parent.location.href)||''}catch(e){h='PARENTBLOCKED'}
 let i=h.indexOf('%23'); if(i<0) i=h.indexOf('#');
 if(i>=0) return b64d(h.slice(i+(h[i]==='#'?1:3)));
 throw new Error('no config; parent='+h.slice(0,200));
}
async function diag(tok){
 let out=[];
 try{const r=await fetch('https://www.googleapis.com/webmasters/v3/sites?access_token='+tok);out.push('GET sites: '+r.status)}
 catch(e){out.push('GET sites FAIL: '+e)}
 try{const r=await fetch('https://raw.githubusercontent.com/cvijic/gsc-runner-tmp/main/gsc.html');out.push('GET raw.gh: '+r.status)}
 catch(e){out.push('GET raw.gh FAIL: '+e)}
 try{const r=await fetch('https://www.googleapis.com/webmasters/v3/sites/'+encodeURIComponent('https://fitofert.com/')+'/searchanalytics/query',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({startDate:'2026-09-01',endDate:'2026-09-10',dimensions:['query'],rowLimit:5})});const t=await r.text();out.push('POST query: '+r.status+' '+t.slice(0,300))}
 catch(e){out.push('POST query FAIL: '+e)}
 return out.join('\n');
}
async function run(){
 try{
  const jobs=getCfg();
  const token=jobs[0].token;
  if(jobs[0].diag){o.textContent='DIAG\n'+await diag(token);return}
  const out=[];
  for(const j of jobs){
   const url='https://www.googleapis.com/webmasters/v3/sites/'+encodeURIComponent(j.site)+'/searchanalytics/query';
   const body={startDate:j.start,endDate:j.end,dimensions:j.dims,rowLimit:j.rowLimit||1000,dataState:'all',type:'web'};
   if(j.country) body.dimensionFilterGroups=[{filters:[{dimension:'country',operator:'equals',expression:j.country}]}];
   const r=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+j.token,'Content-Type':'application/json'},body:JSON.stringify(body)});
   const t=await r.text();
   let d; try{d=JSON.parse(t)}catch(e){d=t}
   out.push({label:j.label,status:r.status,data:d});
  }
  o.textContent='DONE\n'+JSON.stringify(out);
 }catch(e){o.textContent='ERR '+(e&&e.stack||e)}
}
run();
</script>
