<!doctype html><meta charset="utf-8"><title>gsc runner</title><pre id="o">LOADING</pre>
<script>
const o=document.getElementById('o');
function b64d(s){s=decodeURIComponent(s);s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function getCfg(){
 let s=location.hash.slice(1);
 if(s) return b64d(s);
 let h='';
 try{h=(window.parent&&parent.location&&parent.location.href)||''}catch(e){h='PARENTBLOCKED'}
 let i=h.indexOf('%23'); if(i<0) i=h.indexOf('#');
 if(i>=0) return b64d(h.slice(i+(h[i]==='#'?1:3)));
 throw new Error('no config; parent='+h.slice(0,200));
}
const BODY={startDate:'2026-09-01',endDate:'2026-09-10',dimensions:['query'],rowLimit:5};
const SITE=encodeURIComponent('https://fitofert.com/');
async function tryone(name,url,tok){
 try{
  const r=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(BODY)});
  const t=await r.text();
  return name+': '+r.status+' '+t.slice(0,200);
 }catch(e){return name+' FAIL: '+e}
}
async function run(){
 try{
  const jobs=getCfg();
  const tok=jobs[0].token;
  const out=[];
  out.push(await tryone('E content-searchconsole','https://content-searchconsole.googleapis.com/webmasters/v3/sites/'+SITE+'/searchanalytics/query',tok));
  out.push(await tryone('F content-www googleapis','https://content-www.googleapis.com/webmasters/v3/sites/'+SITE+'/searchanalytics/query',tok));
  o.textContent='DIAG\n'+out.join('\n\n');
 }catch(e){o.textContent='ERR '+(e&&e.stack||e)}
}
run();
</script>
