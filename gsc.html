<!doctype html><meta charset="utf-8"><title>gsc runner</title><pre id="o">LOADING</pre>
<script>
const o=document.getElementById('o');
function b64d(s){s=decodeURIComponent(s);s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function getCfg(){
 let s=location.hash.slice(1);
 if(s) return b64d(s);
 let h='';
 try{h=(window.parent&&parent.location&&parent.location.href)||''}catch(e){h='PARENTBLOCKED'}
 let i=h.indexOf('%23'); if(i<0) i=h.indexOf('#');
 if(i>=0) return b64d(h.slice(i+(h[i]==='#'?1:3)));
 throw new Error('no config; parent='+h.slice(0,200));
}
async function gscQuery(site, body, token){
 const url='https://www.googleapis.com/webmasters/v3/sites/'+encodeURIComponent(site)+'/searchanalytics/query?access_token='+encodeURIComponent(token);
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
 const t=await r.text();
 let d; try{d=JSON.parse(t)}catch(e){d=t}
 return {status:r.status,data:d};
}
async function run(){
 try{
  const jobs=getCfg();
  const out=[];
  for(const j of jobs){
   const body={startDate:j.start,endDate:j.end,dimensions:j.dims,rowLimit:j.rowLimit||1000,dataState:'all',type:'web'};
   if(j.country) body.dimensionFilterGroups=[{filters:[{dimension:'country',operator:'equals',expression:j.country}]}];
   const res=await gscQuery(j.site, body, j.token);
   out.push({label:j.label,status:res.status,data:res.data});
  }
  o.textContent='DONE\n'+JSON.stringify(out);
 }catch(e){o.textContent='ERR '+(e&&e.stack||e)}
}
run();
</script>
