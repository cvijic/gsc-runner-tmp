<!doctype html><meta charset="utf-8"><title>gsc runner 3</title><pre id="o">LOADING
</pre>
<script>
const o=document.getElementById('o');
function log(s){o.textContent+=s+'\n'}
function b64d(s){s=decodeURIComponent(s);s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function getCfg(){
 let s=location.hash.slice(1);
 if(s) return b64d(s);
 let h='';
 try{h=(window.parent&&parent.location&&parent.location.href)||''}catch(e){h='PARENTBLOCKED'}
 let i=h.indexOf('%23'); if(i<0) i=h.indexOf('#');
 if(i>=0) return b64d(h.slice(i+(h[i]==='#'?1:3)));
 throw new Error('no config; parent='+h.slice(0,200));
}
const BODY={startDate:'2026-09-01',endDate:'2026-09-10',dimensions:['query'],rowLimit:5};
const TARGET='https://www.googleapis.com/webmasters/v3/sites/'+encodeURIComponent('https://fitofert.com/')+'/searchanalytics/query';
async function tryone(name,url,tok){
 try{
  const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),12000);
  const r=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(BODY),signal:ac.signal});
  clearTimeout(tm);
  const t=await r.text();
  log(name+': '+r.status+' '+t.slice(0,200));
 }catch(e){log(name+' FAIL: '+e)}
}
async function run(){
 try{
  const jobs=getCfg();
  const tok=jobs[0].token;
  o.textContent='DIAG3\n';
  try{const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),8000);const r=await fetch('https://corsproxy.io/?url='+encodeURIComponent('https://example.com'),{signal:ac.signal});clearTimeout(tm);log('GET corsproxy example: '+r.status)}catch(e){log('GET corsproxy FAIL: '+e)}
  try{const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),8000);const r=await fetch('https://api.codetabs.com/v1/proxy?quest=https://example.com',{signal:ac.signal});clearTimeout(tm);log('GET codetabs example: '+r.status)}catch(e){log('GET codetabs FAIL: '+e)}
  await tryone('P1 corsproxy POST','https://corsproxy.io/?url='+encodeURIComponent(TARGET),tok);
  await tryone('P2 codetabs POST','https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(TARGET),tok);
  log('END');
 }catch(e){log('ERR3 '+(e&&e.stack||e))}
}
run();
</script>
